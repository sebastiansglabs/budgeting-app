<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <title>Budget</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --border: #E6E6EA;
      --border-strong: #A1A1AA;
      --ink: #0E0E10;
      --muted: #8C8C93;
      --line: #EFEFF1;
      --track: #F1F1F3;
      --accent: #0E0E10;
      --accent-ink: #FFFFFF;
      --danger: #E5484D;
      --warn: #D4901A;
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body.locked { overflow: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
    .num { font-variant-numeric: tabular-nums; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Layout */
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 10px) 20px calc(116px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .month { display: flex; align-items: center; gap: 2px; margin-left: -10px; }
    .month h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; padding: 0 2px; }
    .month h1 span { color: var(--muted); font-weight: 500; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
    .icon-btn:active { background: #F7F7F8; }
    .icon-btn:disabled { opacity: .2; pointer-events: none; }
    .icon-btn svg { width: 20px; height: 20px; }
    .menu-btn { border: 1px solid var(--border); margin-right: -2px; }

    /* Outlined white cards */
    .card-list { border: 1px solid var(--border); border-radius: 20px; padding: 0 16px; }
    .card-list > .row + .row { border-top: 1px solid var(--line); }

    /* Ring */
    .summary { display: grid; place-items: center; padding: 24px 0; border: 1px solid var(--border); border-radius: 24px; }
    .ring-wrap { position: relative; width: min(66vw, 250px); aspect-ratio: 1; }
    #ring { width: 100%; height: 100%; transform: rotate(-90deg); animation: ring-in .8s cubic-bezier(.2, .8, .2, 1); }
    @keyframes ring-in { from { transform: rotate(-200deg); } }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 0;
    }
    .ring-label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .ring-total { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1.25; }
    .ring-sub { font-size: 13px; color: var(--muted); }
    .ring-sub.over { color: var(--danger); font-weight: 500; }

    /* Sections */
    .section-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; }
    h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
    .pill-btn {
      height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface); border: 1px solid var(--border);
      font-size: 14px; font-weight: 500; flex: none;
    }
    .pill-btn:active { background: #F7F7F8; }

    /* Icon badges */
    .badge {
      width: 40px; height: 40px; border-radius: 50%; flex: none;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--c) 24%, #FFFFFF);
      color: color-mix(in srgb, var(--c) 72%, #000000);
    }
    .badge.solid { background: var(--c); color: #FFFFFF; }
    .badge svg { width: 20px; height: 20px; }
    .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
    .badge.solid .dot { background: #FFFFFF; }
    .badge.md { width: 34px; height: 34px; }
    .badge.md svg { width: 18px; height: 18px; }
    .badge.sm { width: 24px; height: 24px; }
    .badge.sm svg { width: 14px; height: 14px; }
    .badge.sm .dot { width: 8px; height: 8px; }

    .row {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
      column-gap: 14px; row-gap: 8px; width: 100%; padding: 12px 0; text-align: left;
    }
    .row:active { opacity: .6; }
    .row-name { font-size: 15px; font-weight: 500; }
    .row-meta { font-size: 13px; color: var(--muted); }
    .row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .row-amt { font-size: 15px; font-weight: 600; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .row-amt .of { color: var(--muted); font-weight: 400; font-size: 13px; }
    .row-amt small { font-size: 12px; font-weight: 400; color: var(--muted); }
    .bar { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: -2px; }
    .bar i { display: block; height: 100%; border-radius: 3px; background: color-mix(in srgb, var(--c) 85%, #000000); transition: width .5s ease; }
    .row.near .of { color: var(--warn); }
    .row.over .row-amt, .row.over .of { color: var(--danger); }
    .row.over .bar i { background: var(--danger); }

    .day + .day { margin-top: 14px; }
    .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 500; padding: 4px 4px 8px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 20px; font-size: 14px; line-height: 1.5; border: 1px solid var(--border); border-radius: 20px; }

    /* Bottom button */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 18px 20px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 65%, rgba(255, 255, 255, 0));
      display: flex; justify-content: center;
    }
    .primary-btn {
      width: 100%; max-width: 520px; height: 54px; border-radius: 27px;
      background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600;
      transition: transform .12s ease;
    }
    .primary-btn:active { transform: scale(.98); }
    .danger-btn { height: 44px; color: var(--danger); font-weight: 500; font-size: 15px; }

    /* Sheets */
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 15; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 20;
      max-width: 560px; margin: 0 auto;
      max-height: calc(var(--vvh, 100dvh) - 24px); overflow-y: auto; overscroll-behavior: contain;
      background: var(--bg); border-radius: 28px 28px 0 0;
      padding: 8px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .08);
      transform: translateY(110%); visibility: hidden;
      transition: transform .32s cubic-bezier(.32, .72, 0, 1), visibility 0s .32s;
    }
    .sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.32, .72, 0, 1); }
    /* Never squash contents when the keyboard shrinks the sheet; scroll instead */
    .sheet > * { flex-shrink: 0; }
    .sheet::before { content: ""; align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line); flex: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin: -4px -8px 0 0; }
    .sheet-head h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
    .label { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: -6px; }

    .amount-field { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 0 0; overflow: hidden; }
    .amount-field .cur { font-size: 28px; font-weight: 500; color: var(--muted); line-height: 1; flex: none; }
    #expAmount {
      font-size: 52px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; border: 0; background: none; color: var(--ink);
      max-width: 80%; outline: none; padding: 0; text-align: left;
    }
    #expAmount::placeholder { color: #D9D9DE; }
    .seg { display: flex; align-self: center; gap: 2px; padding: 3px; border-radius: 14px; border: 1px solid var(--border); }
    .seg button { height: 32px; padding: 0 20px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .seg button.on { background: var(--ink); color: #FFFFFF; }
    .conv { font-size: 13px; color: var(--muted); text-align: center; margin-top: -6px; }
    .conv:empty { display: none; }

    .field {
      display: block; width: 100%; font-size: 16px; line-height: 1.45; padding: 14px 16px; border-radius: 16px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink); outline: none; resize: none;
      -webkit-appearance: none; appearance: none;
    }
    textarea.field { min-height: 52px; overflow: hidden; }
    .field:focus { border-color: var(--border-strong); }
    .field::placeholder { color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px;
      border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 500;
    }
    .chip.on { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
    .chip.add { padding: 0 16px; color: var(--muted); border-style: dashed; }
    .stamp { font-size: 13px; color: var(--muted); text-align: center; }
    .stamp:empty { display: none; }

    .icons { display: flex; justify-content: space-between; }
    .icon-opt { border-radius: 50%; padding: 2px; flex: none; }
    .icon-opt.on { box-shadow: 0 0 0 2px var(--ink); }
    .swatches { display: grid; grid-template-columns: repeat(9, 1fr); justify-items: center; padding: 4px 0; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; background: var(--c); transition: box-shadow .15s; }
    .swatch.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c); }
    .swatch.custom {
      background: conic-gradient(hsl(0, 70%, 80%), hsl(60, 70%, 80%), hsl(120, 70%, 80%), hsl(180, 70%, 80%),
        hsl(240, 70%, 80%), hsl(300, 70%, 80%), hsl(360, 70%, 80%));
    }
    .swatch.custom.on { background: var(--c); }
    .hue { padding: 2px 2px 4px; display: flex; flex-direction: column; gap: 14px; }
    .hue input {
      -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; border-radius: 14px; outline: none;
    }
    #hue {
      background: linear-gradient(to right, hsl(0, 70%, 80%), hsl(60, 70%, 80%), hsl(120, 70%, 80%), hsl(180, 70%, 80%),
        hsl(240, 70%, 80%), hsl(300, 70%, 80%), hsl(360, 70%, 80%));
    }
    .hue input::-webkit-slider-thumb {
      -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%;
      background: var(--c, #fff); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .3);
    }
    .hue input::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--c, #fff); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .3);
    }
    .budget-field {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; height: 52px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); font-size: 16px;
    }
    .budget-field:focus-within { border-color: var(--border-strong); }
    .budget-field .in { display: flex; align-items: center; gap: 2px; color: var(--muted); }
    .budget-field input { border: 0; background: none; text-align: right; width: 110px; outline: none; color: var(--ink); }
    .budget-field input::placeholder { color: var(--muted); }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
    .setting strong { font-size: 15px; font-weight: 600; display: block; margin-bottom: 2px; }
    .btn-row { display: flex; gap: 8px; flex: none; }

    .toast {
      position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 10px); z-index: 30;
      max-width: 420px; margin: 0 auto; padding: 12px 18px; border-radius: 20px;
      background: var(--ink); color: #FFFFFF; font-size: 14px; line-height: 1.4;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
      transform: translateY(calc(-100% - 60px - env(safe-area-inset-top))); transition: transform .35s cubic-bezier(.32, .72, 0, 1);
    }
    .toast.show { transform: none; }
    .toast b { display: block; font-weight: 600; }

    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="month">
        <button class="icon-btn" id="prevMonth" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h1 id="monthLabel"></h1>
        <button class="icon-btn" id="nextMonth" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button class="icon-btn menu-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
      </button>
    </header>

    <section class="summary">
      <div class="ring-wrap">
        <svg id="ring" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="ring-center">
          <span class="ring-label" id="ringLabel"></span>
          <span class="ring-total num" id="ringTotal"></span>
          <span class="ring-sub" id="ringSub"></span>
        </div>
      </div>
    </section>

    <section>
      <div class="section-head"><h2>Categories</h2><button class="pill-btn" id="newCatBtn">+ New</button></div>
      <div id="catList"></div>
    </section>

    <section>
      <div class="section-head"><h2>Activity</h2></div>
      <div id="logList"></div>
    </section>
  </main>

  <div class="dock"><button class="primary-btn" id="addBtn">Add expense</button></div>

  <div class="scrim" id="scrim"></div>

  <form class="sheet" id="expenseSheet" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h3 id="expHeading">New expense</h3>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="amount-field num" id="amountField">
      <span class="cur" id="expSym">$</span><input id="expAmount" inputmode="decimal" placeholder="0" aria-label="Amount">
    </label>
    <div class="seg" id="expCur" role="group" aria-label="Currency"></div>
    <p class="conv num" id="expConv"></p>
    <input class="field" id="expTitle" placeholder="Title" maxlength="60" enterkeyhint="next">
    <div class="chips" id="expCats"></div>
    <textarea class="field" id="expNote" rows="1" placeholder="Short description (optional)" maxlength="140"></textarea>
    <p class="stamp" id="expStamp"></p>
    <button class="primary-btn" type="submit" id="expSubmit">Log expense</button>
    <button class="danger-btn" type="button" id="expDelete">Delete expense</button>
  </form>

  <form class="sheet" id="categorySheet" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h3 id="catHeading">New category</h3>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <input class="field" id="catName" placeholder="Name, e.g. Morning coffee" maxlength="30" enterkeyhint="done">
    <p class="label">Icon</p>
    <div class="icons" id="catIcons"></div>
    <p class="label">Color</p>
    <div class="swatches" id="catColors"></div>
    <div class="hue" id="hueRow" hidden>
      <input type="range" id="hue" min="0" max="359" step="1" aria-label="Custom color hue">
      <input type="range" id="light" min="45" max="85" step="1" aria-label="Custom color brightness">
    </div>
    <label class="budget-field">
      <span>Monthly budget</span>
      <span class="in num"><span data-sym>$</span><input id="catBudget" inputmode="decimal" placeholder="None"></span>
    </label>
    <p class="hint">Optional, in USD (BZD spending counts at 2 BZD = 1 USD). You'll get a notification at 80% and when it's reached. Spending resets on the 1st of each month.</p>
    <button class="primary-btn" type="submit">Save category</button>
    <button class="danger-btn" type="button" id="catDelete">Delete category</button>
  </form>

  <div class="sheet" id="settingsSheet">
    <div class="sheet-head">
      <h3>Settings</h3>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="setting">
      <div><strong>Budget alerts</strong><p class="hint" id="notifStatus"></p></div>
      <button class="pill-btn" id="notifBtn">Enable</button>
    </div>
    <div class="setting">
      <div><strong>Backup</strong><p class="hint">Your data is stored only on this device.</p></div>
      <div class="btn-row">
        <button class="pill-btn" id="exportBtn">Export</button>
        <button class="pill-btn" id="importBtn">Import</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
